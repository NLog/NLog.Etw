name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      force_nuget_publish:
        description: Force NuGet publish for non-master. The package version gets a suffix.
        type: boolean
        default: false

env:
  SOLUTION: NLog.Etw.sln

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Build & test (Windows)
            upload_coverage: true
          - os: ubuntu-latest
            name: Build & test (Ubuntu)
            upload_coverage: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test net471
        if: runner.os == 'Windows'
        run: dotnet test NLog.Etw.Tests/NLog.Etw.Tests.csproj --configuration Release --framework net471 --no-restore --no-build --collect:"XPlat Code Coverage" --logger GitHubActions -- RunConfiguration.DisableAppDomain=true

      - name: Test net8.0 (Windows)
        if: runner.os == 'Windows'
        run: dotnet test NLog.Etw.Tests/NLog.Etw.Tests.csproj --configuration Release --framework net8.0 --no-restore --no-build --collect:"XPlat Code Coverage" --logger GitHubActions

      - name: Test net8.0 (Ubuntu)
        if: runner.os == 'Linux'
        run: dotnet test NLog.Etw.Tests/NLog.Etw.Tests.csproj --configuration Release --framework net8.0 --no-restore --no-build --logger GitHubActions

      - name: Upload coverage to Codecov
        if: matrix.upload_coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # https://github.com/codecov/codecov-action/releases/tag/v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: NLog.Etw.Tests/**/TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: true

  pack:
    name: Create NuGet package
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Determine version suffix
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF -eq "refs/heads/master") {
            echo "suffix=" >> $env:GITHUB_OUTPUT
          } elseif ($env:PR_NUMBER) {
            echo "suffix=pr.$($env:PR_NUMBER).ci.$($env:RUN_NUMBER)" >> $env:GITHUB_OUTPUT
          } else {
            echo "suffix=ci.$($env:RUN_NUMBER)" >> $env:GITHUB_OUTPUT
          }

      - name: Create NuGet package
        shell: pwsh
        env:
          VERSION_SUFFIX: ${{ steps.version.outputs.suffix }}
        run: dotnet pack $env:SOLUTION --no-restore --configuration Release --output artifacts -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:EmbedUntrackedSources=true -p:ContinuousIntegrationBuild=true --version-suffix "$env:VERSION_SUFFIX"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: NuGetPackages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    name: Publish NuGet package
    needs: [build, pack]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_nuget_publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v7
        with:
          name: NuGetPackages
          path: artifacts

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate